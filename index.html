<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EE Oito de Abril</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:50px;
}

h1{
    color:#3b82f6;
}

p{
    color:#94a3b8;
}

.creditos{
    font-size:14px;
    color:#cbd5e1;
    margin-top:15px;
    background:#1e293b;
    display:inline-block;
    padding:10px 20px;
    border-radius:20px;
    border:1px solid #3b82f6;
}

textarea{
    width:80%;
    max-width:700px;
    height:120px;
    padding:15px;
    border-radius:8px;
    border:2px solid #3b82f6;
    background:#1e293b;
    color:white;
    font-size:16px;
    margin-top:20px;
}

button{
    margin-top:15px;
    padding:15px 30px;
    background:#10b981;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#059669;
}

#resposta{
    margin-top:30px;
    color:#f8fafc;
    font-size:17px;
    line-height:1.8;
    max-width:900px;
    margin-left:auto;
    margin-right:auto;
    text-align:left;
    background:#1e293b;
    padding:25px;
    border-radius:8px;
    border-left:5px solid #3b82f6;
    white-space:pre-wrap;
    display:none;
}
</style>

</head>

<body>

<h1>EE 8 de Abril - Reta Final ENEM 2026</h1>

<p>
Alinhado às diretrizes da SEDUC e BNCC para turbinar seu engajamento.
</p>

<div class="creditos">
Desenvolvido para os alunos dos <strong>3º Anos 2026 EE Oito de Abril</strong>
</div>

<br><br>

<textarea
    id="pergunta"
    placeholder="Digite um tema. Ex: Revolução Francesa, Citologia, Logaritmos..."
></textarea>

<br>

<button onclick="chamarIA()">
Descobrir como cai na prova
</button>

<div id="resposta"></div>

<script>

async function chamarIA() {

    const pergunta = document.getElementById("pergunta").value.trim();
    const resposta = document.getElementById("resposta");

    if (!pergunta) {
        alert("Digite um tema para estudar.");
        return;
    }

    resposta.style.display = "block";
    resposta.innerText = "🔎 Consultando a IA...";

    try {

        const req = await fetch("/perguntar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                texto: pergunta
            })
        });

        const dados = await req.json();

        resposta.innerText =
            dados.resposta || "Nenhuma resposta retornada.";

    } catch (erro) {

        console.error(erro);

        resposta.innerText =
            "Erro de conexão com o servidor.";
    }
}

</script>

</body>
</html>
