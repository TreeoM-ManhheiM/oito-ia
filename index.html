<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EE Oito de Abril - Reta Final ENEM 2026</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:40px;
}

h1{
    color:#3b82f6;
    margin-bottom:10px;
}

p{
    color:#94a3b8;
}

.creditos{
    display:inline-block;
    margin:15px 0 25px 0;
    padding:12px 20px;
    border-radius:10px;
    background:#1e293b;
    border:1px solid #3b82f6;
}

textarea{
    width:85%;
    max-width:750px;
    height:120px;
    background:#1e293b;
    color:white;
    border:2px solid #3b82f6;
    border-radius:8px;
    padding:15px;
    font-size:16px;
    resize:vertical;
}

textarea:focus{
    outline:none;
    border-color:#10b981;
}

button{
    margin-top:15px;
    padding:15px 30px;
    border:none;
    border-radius:8px;
    background:#10b981;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#059669;
}

#resposta{
    margin-top:30px;
    max-width:900px;
    margin-left:auto;
    margin-right:auto;
    text-align:left;
    background:#1e293b;
    padding:25px;
    border-left:5px solid #3b82f6;
    border-radius:10px;
    white-space:pre-wrap;
    line-height:1.8;
    display:none;
}
</style>
</head>

<body>

<h1>🎓 EE Oito de Abril - Reta Final ENEM 2026</h1>

<p>
Aprenda qualquer tema da prova usando explicações no estilo ENEM.
</p>

<div class="creditos">
    Desenvolvido para os alunos dos <strong>3º Anos 2026 - EE Oito de Abril</strong>
</div>

<br>

<textarea
    id="pergunta"
    placeholder="Exemplo: Era Vargas, Citologia, Função Exponencial, Revolução Francesa..."
></textarea>

<br>

<button onclick="chamarIA()">
🚀 Descobrir como cai na prova
</button>

<div id="resposta"></div>

<script>
async function chamarIA() {

    const pergunta = document.getElementById("pergunta").value.trim();
    const respostaDiv = document.getElementById("resposta");

    if (!pergunta) {
        alert("Digite um tema para estudar.");
        return;
    }

    respostaDiv.style.display = "block";
    respostaDiv.innerText =
        "🔎 Analisando as competências, habilidades e matriz do ENEM...";

    try {

        const response = await fetch("/perguntar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                texto: pergunta
            })
        });

        const dados = await response.json();

        if (!response.ok) {
            respostaDiv.innerText =
                "Erro no servidor:\n\n" +
                JSON.stringify(dados, null, 2);
            return;
        }

        respostaDiv.innerText =
            dados.resposta || "Nenhuma resposta retornada.";

    } catch (erro) {

        console.error(erro);

        respostaDiv.innerText =
            "❌ Falha ao conectar à IA.\n\n" +
            erro.message;
    }
}
</script>

</body>
</html>
